services:
  - type: web
    name: gestionbdt
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: gestionbdt-db
          property: connectionString

databases:
  - name: gestionbdt-db
    databaseName: gestionbdt
    user: postgres
    plan: free
