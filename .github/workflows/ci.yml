name: CI – Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gestionbdt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration test (app + PostgreSQL)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestionbdt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql

      - name: Verify database connection & migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gestionbdt
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php -r "
            require 'app/Config/Database.php';
            \$pdo = App\Config\Database::connect();
            echo 'Connection OK' . PHP_EOL;
            \$tables = \$pdo->query(\"SELECT tablename FROM pg_tables WHERE schemaname='public'\")->fetchAll();
            foreach (\$tables as \$t) echo 'Table: ' . \$t['tablename'] . PHP_EOL;
          "
